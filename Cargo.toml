[package]
name = "joinus"
version = "0.4.0"
edition = "2021"
description = "Messagerie locale multi-utilisateurs"
authors = ["Johanes-mg"]

[dependencies]
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "wgpu"] }
egui = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
wgpu = { version = "0.20", features = ["dx12"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
